[project]
name = "comfyui-onnxtagger"
description = "ONNX (FP16 + CUDA) で wd-eva02-large-tagger-v3 を呼び、タグ文字列と検閲状態 4 値 (uncensored / censored / no_explicit / unknown) を同時に返す ComfyUI ノード。"
version = "1.0.0"
license = { file = "LICENSE" }
dependencies = [
    "onnxruntime-gpu>=1.27,<2 ; sys_platform != 'darwin'",
    "onnxruntime>=1.20,<2 ; sys_platform == 'darwin'",
    "torch>=2.9",
    "numpy>=1.24",
    "Pillow>=10",
    "onnx",
    "onnxconverter_common",
]

[project.urls]
Repository = "https://github.com/sugarkwork/comfyui-onnxtagger"

[tool.comfy]
PublisherId = "sugarknight"
DisplayName = "comfyui-onnxtagger"
Icon = ""
